<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup</title>
  <link rel="stylesheet" href="signup.css" />
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <div class="form">
    <h2>Sign Up</h2>
    <form action="#">
      <input type="email" name="email" placeholder="Enter email here" required />
      <input type="text" name="disaster" placeholder="Enter type of disaster here" required />
      <input type="tel" name="phonenumber" placeholder="Enter phone number here" required />
      <input type="password" name="password" placeholder="Enter password" required />
      <input type="password" name="confirmpassword" placeholder="Confirm password here" required />
      <button class="btnn" type="submit">Sign Up</button>
    </form>

    <p class="liw">Log in with</p>

    <div class="icons">
      <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
      <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
      <a href="#"><ion-icon name="logo-twitter"></ion-icon></a>
      <a href="#"><ion-icon name="logo-google"></ion-icon></a>
      <a href="#"><ion-icon name="logo-skype"></ion-icon></a>
    </div>
  </div>

</body>
</html>
